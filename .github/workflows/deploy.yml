name: Deploy — CTI Platform

on:
  push:
    branches: [master, main]
    paths:
      - "cti_platform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

jobs:
  push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./cti_platform
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cti-platform:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cti-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: push-image
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/cti-platform

            # Pull latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cti-platform:latest

            # Recreate container with zero downtime
            docker-compose pull
            docker-compose up -d --force-recreate

            # Clean old images
            docker image prune -f

            echo "✅ Déploiement terminé: $(date)"

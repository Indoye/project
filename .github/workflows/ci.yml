name: CI — CTI Platform

on:
  push:
    branches: [master, main, develop]
    paths:
      - "cti_platform/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "cti_platform/**"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cti_platform/requirements.txt

      - name: Install dependencies
        working-directory: cti_platform
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with Ruff
        working-directory: cti_platform
        run: ruff check app/

      - name: Run tests
        working-directory: cti_platform
        env:
          DATABASE_URL: sqlite:///./test_cti.db
          VIRUSTOTAL_API_KEY: ""
          ABUSEIPDB_API_KEY: ""
          SHODAN_API_KEY: ""
        run: pytest tests/ -v --tb=short || echo "No tests found yet"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cti_platform
          push: false
          tags: cti-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

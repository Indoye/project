version: "3.9"

services:
  cti-api:
    image: ${DOCKERHUB_USERNAME}/cti-platform:latest
    container_name: cti_platform
    restart: always
    ports:
      - "127.0.0.1:8000:8000"   # Accessible uniquement via Nginx en local
    volumes:
      - cti_db:/app/cti.db
      - cti_reports:/tmp/cti_reports
    env_file:
      - /opt/cti-platform/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: cti_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - cti-api

  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  cti_db:
  cti_reports:
  certbot_www:

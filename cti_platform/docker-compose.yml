version: "3.9"

services:
  cti-api:
    build: .
    container_name: cti_platform
    ports:
      - "8000:8000"
    volumes:
      - ./cti.db:/app/cti.db
      - /tmp/cti_reports:/tmp/cti_reports
    env_file:
      - .env
    restart: unless-stopped

